<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian | الإدارة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--line:#e2e8f0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fafc,#eff6ff);color:var(--ink);font-family:Cairo,Arial,sans-serif;min-height:100vh}.shell{width:min(1100px,calc(100% - 36px));margin:auto}.top{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 18px Manrope;letter-spacing:-.5px;display:flex;gap:10px;align-items:center;direction:ltr}.brand img{width:36px;height:36px;border-radius:11px;object-fit:cover}.logout{border:1px solid #fecaca;background:#fff;color:#b91c1c;padding:9px 13px;border-radius:10px;cursor:pointer;font:700 13px Cairo}.hero{padding:36px 0 29px}.eyebrow{display:inline-flex;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:99px;padding:5px 10px;font:700 11px Manrope}.hero h1{font-size:clamp(28px,4vw,45px);margin:9px 0 4px;letter-spacing:-1.2px}.hero p{margin:0;color:var(--muted)}.dashboard{display:grid;grid-template-columns:1.07fr .93fr;gap:20px;align-items:start;padding-bottom:50px}.panel{background:rgba(255,255,255,.88);border:1px solid rgba(226,232,240,.9);border-radius:20px;padding:25px;box-shadow:0 15px 35px rgba(30,64,175,.07)}.panel h2{font-size:18px;margin:0 0 20px;display:flex;gap:9px;align-items:center}.panel h2 i{color:var(--blue)}.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#334155}input,select,textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink);outline:none;font:500 13px Cairo;transition:.2s}textarea{resize:vertical;min-height:110px}input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.help{font-size:11px;color:var(--muted);margin:0}.form-actions{display:flex;gap:10px;margin-top:19px}.publish,.cancel{border:0;border-radius:10px;font:700 13px Cairo;cursor:pointer;padding:11px 16px}.publish{background:linear-gradient(130deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.18)}.cancel{display:none;background:#f1f5f9;color:#475569}.apps-list{display:grid;gap:11px}.admin-card{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}.item-info{display:flex;gap:10px;align-items:center;min-width:0}.item-info img{width:43px;height:43px;object-fit:cover;border-radius:11px}.item-info h3{font-size:13px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-info small{font:600 10px Manrope;color:var(--muted)}.chip{font-size:10px;border-radius:99px;background:#eff6ff;color:#1d4ed8;padding:3px 6px}.actions{display:flex;gap:5px}.act{border:0;border-radius:8px;padding:7px 8px;cursor:pointer;font:700 11px Cairo}.edit{color:#1d4ed8;background:#eff6ff}.delete{color:#b91c1c;background:#fef2f2}.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.48);backdrop-filter:blur(8px);padding:20px}.login{width:min(100%,400px);background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:31px;box-shadow:0 25px 70px rgba(15,23,42,.22);text-align:center}.login img{width:62px;height:62px;border-radius:18px;object-fit:cover;box-shadow:0 8px 18px rgba(37,99,235,.16)}.login h2{margin:12px 0 2px;font-size:23px}.login p{margin:0 0 19px;color:var(--muted);font-size:13px}.login input{width:100%;margin:5px 0;text-align:right}.login button{width:100%;margin-top:11px}.error{display:none;color:#b91c1c;font-size:12px;margin:8px 0 0}@media(max-width:760px){.dashboard{grid-template-columns:1fr}.input-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:19px}.top{height:67px}.hero{padding:27px 0}.admin-card{align-items:flex-start}.actions{flex-direction:column}.shell{width:min(100% - 26px,600px)}}
</style></head><body>
<div id="loginOverlay" class="overlay"><div class="login"><img src="logo.jpg" alt="Obsidian"><h2>مساحة الإدارة</h2><p>سجّل الدخول لإدارة أنظمة المتجر.</p><input id="adminEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="adminPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="publish" onclick="loginAdmin()">تسجيل الدخول <i class="fa-solid fa-arrow-left"></i></button><p id="loginError" class="error">بيانات الدخول غير صحيحة.</p></div></div>
<main id="mainAdminContent" style="display:none"><header class="top shell"><a class="brand" href="index.html"><img src="logo.jpg" alt="Obsidian">OBSIDIAN</a><button class="logout" onclick="logoutAdmin()"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</button></header><section class="hero shell"><span class="eyebrow">CONTENT CONTROL</span><h1>مركز إدارة الأنظمة</h1><p>أضف التطبيقات وحرّر تفاصيلها لتظهر مباشرة في متجر Obsidian.</p></section><div class="dashboard shell"><section class="panel"><h2><i class="fa-solid fa-sparkles"></i> <span id="formTitle">نشر نظام جديد</span></h2><div class="input-grid"><div class="field"><label for="appName">اسم النظام / التطبيق</label><input id="appName" required placeholder="مثال: نظام إدارة المصانع"></div><div class="field"><label for="appType">نوع النظام</label><select id="appType"><option value="app">تطبيق هاتف</option><option value="web">نظام ويب</option></select></div><div class="field"><label for="appVersion">رقم الإصدار</label><input id="appVersion" placeholder="Version 1.0.0"></div><div class="field"><label for="appImage">أيقونة التطبيق</label><input id="appImage" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field full"><label for="appLink">رابط التحميل أو الموقع</label><input id="appLink" type="url" placeholder="https://example.com — اتركه فارغًا للنسخ الخاصة"></div><div class="field"><label for="tag1">المنصة الأولى</label><input id="tag1" placeholder="Android أو Windows"></div><div class="field"><label for="tag2">المنصة الثانية</label><input id="tag2" placeholder="Mobile App أو Cloud"></div><div class="field full"><label for="appDesc">وصف النظام</label><textarea id="appDesc" required placeholder="اكتب وصفًا مختصرًا وواضحًا..." ></textarea><p class="help">يتم ضغط الصورة المختارة تلقائيًا لتسريع المتجر.</p></div></div><div class="form-actions"><button id="submitBtn" class="publish" onclick="saveData()"><i class="fa-solid fa-cloud-arrow-up"></i> نشر في المتجر</button><button id="cancelBtn" class="cancel" onclick="cancelEdit()">إلغاء التعديل</button></div></section><aside class="panel"><h2><i class="fa-solid fa-cubes"></i> الأنظمة المنشورة</h2><div id="adminAppsList" class="apps-list"><p class="empty">جارٍ التحميل...</p></div></aside></div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getFirestore,collection,addDoc,getDocs,doc,deleteDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const config={apiKey:"AIzaSyBFq9P-DWSpGHthCg-wPo18ZDEc0SCmtEE",authDomain:"obsidian-store-21a3c.firebaseapp.com",projectId:"obsidian-store-21a3c",storageBucket:"obsidian-store-21a3c.firebasestorage.app",messagingSenderId:"888201520225",appId:"1:888201520225:web:70a72718322b524380f620"},app=initializeApp(config),db=getFirestore(app),auth=getAuth(app);let imageBase64='',currentEditId=null;window.appsDataMap={};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
onAuthStateChanged(auth,user=>{$('loginOverlay').style.display=user?'none':'flex';$('mainAdminContent').style.display=user?'block':'none';if(user)loadAdminApps()});window.loginAdmin=()=>{const email=$('adminEmail').value,pass=$('adminPassword').value;if(!email||!pass){$('loginError').textContent='يرجى إدخال البريد وكلمة المرور.';$('loginError').style.display='block';return}signInWithEmailAndPassword(auth,email,pass).catch(()=>{$('loginError').textContent='بيانات الدخول غير صحيحة.';$('loginError').style.display='block'})};window.logoutAdmin=()=>signOut(auth);
$('appImage').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=x=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>300){h=Math.round(h*300/w);w=300}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);imageBase64=canvas.toDataURL('image/jpeg',.78)};img.src=x.target.result};reader.readAsDataURL(file)});
window.saveData=async()=>{const name=$('appName').value.trim(),desc=$('appDesc').value.trim(),btn=$('submitBtn');if(!name||!desc)return alert('يرجى إدخال اسم النظام والوصف.');if(!currentEditId&&!imageBase64)return alert('يرجى اختيار أيقونة للنظام الجديد.');const data={name,desc,type:$('appType').value,version:$('appVersion').value||'Version 1.0',tag1:$('tag1').value||'System',tag2:$('tag2').value||'Software',link:$('appLink').value.trim()};if(imageBase64)data.image=imageBase64;if(!currentEditId)data.timestamp=new Date();btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin"></i> جارٍ الحفظ';try{currentEditId?await updateDoc(doc(db,'store_apps',currentEditId),data):await addDoc(collection(db,'store_apps'),data);cancelEdit();loadAdminApps()}catch(e){alert('تعذر الحفظ. تأكد من صلاحيات قاعدة البيانات.')}finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> نشر في المتجر'}};
window.editApp=id=>{const d=window.appsDataMap[id];if(!d)return;$('appName').value=d.name||'';$('appType').value=d.type||'app';$('appVersion').value=d.version||'';$('tag1').value=d.tag1||'';$('tag2').value=d.tag2||'';$('appDesc').value=d.desc||'';$('appLink').value=d.link||'';$('appImage').value='';imageBase64='';currentEditId=id;$('formTitle').textContent='تعديل النظام';$('submitBtn').innerHTML='<i class="fa-solid fa-pen"></i> حفظ التعديلات';$('cancelBtn').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})};window.cancelEdit=()=>{currentEditId=null;imageBase64='';['appName','appVersion','tag1','tag2','appDesc','appLink','appImage'].forEach(id=>$(id).value='');$('appType').value='app';$('formTitle').textContent='نشر نظام جديد';$('cancelBtn').style.display='none'};
window.loadAdminApps=async()=>{const list=$('adminAppsList');try{const snap=await getDocs(query(collection(db,'store_apps'),orderBy('timestamp','desc')));window.appsDataMap={};if(snap.empty){list.innerHTML='<p class="empty">لا توجد أنظمة منشورة حاليًا.</p>';return}list.innerHTML=[...snap.docs].map(x=>{const d=x.data(),id=x.id;window.appsDataMap[id]=d;return `<article class="admin-card"><div class="item-info"><img src="${esc(d.image||'logo.jpg')}" alt=""><div><h3>${esc(d.name)} <span class="chip">${d.type==='web'?'ويب':'تطبيق'}</span></h3><small>${esc(d.version||'Version 1.0')}</small></div></div><div class="actions"><button class="act edit" onclick="editApp('${id}')">تعديل</button><button class="act delete" onclick="deleteApp('${id}')">حذف</button></div></article>`}).join('')}catch(e){list.innerHTML='<p class="empty" style="color:#b91c1c">تعذر تحميل الأنظمة.</p>'}};window.deleteApp=async id=>{if(!confirm('هل تريد حذف هذا النظام نهائيًا؟'))return;try{await deleteDoc(doc(db,'store_apps',id));if(currentEditId===id)cancelEdit();loadAdminApps()}catch(e){alert('تعذر حذف النظام.')}};
</script></body></html>
