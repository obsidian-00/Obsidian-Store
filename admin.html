<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBSIDIAN NEXUS - مركز النشر</title>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050507; 
            --bg-glass: rgba(20, 22, 28, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --cyan-glow: rgba(56, 189, 248, 0.2);
            --primary: #38BDF8;
        }

        /* منع الحركة العرضية على الموبايل */
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: 150px; 
            padding-bottom: 60px;
            background-image: 
                radial-gradient(circle at 50% 0%, #171A21 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .admin-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto; 
            padding: 0 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الهيدر الخاص بلوحة التحكم */
        .admin-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 5, 7, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            padding: 15px 0;
            text-align: center;
            z-index: 1000;
        }

        .logo-img {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .admin-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(to right, #FFF, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
        }

        .admin-header h1 span {
            color: var(--primary);
            -webkit-text-fill-color: var(--primary);
        }

        .admin-header p {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 2px;
            font-family: 'Montserrat', sans-serif;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 5px;
        }

        label i { color: var(--primary); margin-left: 5px; }

        input, textarea {
            width: 100%;
            background: #0B0C10;
            border: 1px solid #2D323E;
            color: #FFF;
            padding: 16px 20px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input[type="file"] {
            padding: 12px 20px;
            cursor: pointer;
        }

        input::placeholder, textarea::placeholder { color: #475569; }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--cyan-glow);
            background: #0F131A;
        }

        .publish-btn {
            background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%);
            color: #FFF;
            padding: 18px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
        }

        .publish-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #7DD3FC 0%, #0369A1 100%);
        }

        /* تنسيقات قسم التطبيقات المنشورة للحذف */
        .apps-list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-app-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-app-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-app-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            background: #000;
        }

        .admin-app-details h4 {
            margin: 0;
            font-size: 16px;
            color: #FFF;
        }

        .admin-app-details span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delete-btn:hover {
            background: #EF4444;
            color: #FFF;
        }

        @media (max-width: 768px) {
            .input-grid { grid-template-columns: 1fr; gap: 20px; }
            .glass-panel { padding: 25px; }
            body { padding-top: 140px; }
            .admin-app-card { flex-direction: column; align-items: flex-start; gap: 15px; }
            .delete-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <img src="logo.jpg" alt="Obsidian Logo" class="logo-img">
        <h1>OBSIDIAN <span>NEXUS</span></h1>
        <p>Secure Deployment Console</p>
    </div>

    <div class="admin-container">
        <!-- لوحة النشر -->
        <div class="glass-panel">
            <div class="input-grid">
                
                <div class="input-group">
                    <label><i class="fa-solid fa-cube"></i> اسم النظام / التطبيق</label>
                    <input type="text" id="appName" placeholder="مثال: نظام إدارة المصانع" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-code-branch"></i> رقم الإصدار</label>
                    <input type="text" id="appVersion" placeholder="مثال: Version 1.0.2" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-image"></i> أيقونة التطبيق (صورة)</label>
                    <input type="file" id="appImage" accept="image/png, image/jpeg, image/webp" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-link"></i> رابط التحميل المباشر</label>
                    <input type="url" id="appLink" placeholder="اتركه فارغاً لجعله 'مغلق للعملاء'">
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-tag"></i> المنصة الأولى (Tag 1)</label>
                    <input type="text" id="tag1" placeholder="مثال: Android أو Windows" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-microchip"></i> المنصة الثانية (Tag 2)</label>
                    <input type="text" id="tag2" placeholder="مثال: Mobile App أو Local Network" required>
                </div>

                <div class="input-group full-width">
                    <label><i class="fa-solid fa-align-right"></i> وصف تفصيلي</label>
                    <textarea id="appDesc" rows="4" placeholder="اكتب وصفاً احترافياً يعكس مميزات النظام الخاص بك..." required></textarea>
                </div>

            </div>

            <button class="publish-btn" onclick="addApp()" id="submitBtn">
                <i class="fa-solid fa-cloud-arrow-up"></i> نشر في المتجر الآن
            </button>
        </div>

        <!-- لوحة التطبيقات المنشورة (للحذف) -->
        <div class="glass-panel">
            <h3 style="margin-bottom: 20px; color: #FFF; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
                <i class="fa-solid fa-server" style="color: var(--primary);"></i> إدارة التطبيقات المنشورة
            </h3>
            <div class="apps-list-container" id="adminAppsList">
                <p style="text-align: center; color: var(--text-muted);">جاري التحميل...</p>
            </div>
        </div>
    </div>

    <!-- ربط Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFq9P-DWSpGHthCg-wPo18ZDEc0SCmtEE",
            authDomain: "obsidian-store-21a3c.firebaseapp.com",
            projectId: "obsidian-store-21a3c",
            storageBucket: "obsidian-store-21a3c.firebasestorage.app",
            messagingSenderId: "888201520225",
            appId: "1:888201520225:web:70a72718322b524380f620",
            measurementId: "G-84DK7008MP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تحويل الصورة وضغطها أوتوماتيكياً قبل الحفظ لتجنب خطأ الحجم
        let imageBase64 = "";
        document.getElementById('appImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // إنشاء لوحة رسم وهمية لتصغير الصورة
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_WIDTH = 250; // عرض الأيقونة هيكون 250 بكسل فقط
                        
                        // الحفاظ على أبعاد الصورة أثناء التصغير
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // ضغط الصورة وتحويلها لنص بجودة 70%
                        imageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        window.addApp = async function() {
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            
            const name = document.getElementById('appName').value;
            const desc = document.getElementById('appDesc').value;
            if(!name || !desc || !imageBase64) {
                alert("يرجى إدخال اسم النظام، الوصف، واختيار صورة للأيقونة.");
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري النشر...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            
            try {
                await addDoc(collection(db, "store_apps"), {
                    name: name,
                    version: document.getElementById('appVersion').value || 'Version 1.0',
                    image: imageBase64, // حفظ الصورة المضغوطة
                    tag1: document.getElementById('tag1').value || 'System',
                    tag2: document.getElementById('tag2').value || 'Software',
                    desc: desc,
                    link: document.getElementById('appLink').value || '',
                    timestamp: new Date()
                });
                
                alert("تم إضافة النظام بنجاح إلى واجهة المتجر!");
                // تصفير الحقول وتحديث القائمة
                document.getElementById('appName').value = '';
                document.getElementById('appDesc').value = '';
                document.getElementById('appImage').value = '';
                imageBase64 = '';
                loadAdminApps();
                
            } catch (e) {
                console.error("Error: ", e);
                alert("حدث خطأ أثناء الاتصال بقاعدة البيانات.");
            } finally {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }

        // جلب التطبيقات وعرضها للحذف
        window.loadAdminApps = async function() {
            const list = document.getElementById('adminAppsList');
            try {
                const q = query(collection(db, "store_apps"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                list.innerHTML = ''; 
                if(querySnapshot.empty) {
                    list.innerHTML = '<p style="text-align: center; color: var(--text-muted);">لا توجد تطبيقات منشورة حالياً.</p>';
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    const imgSource = data.image ? data.image : 'logo.jpg';
                    
                    list.innerHTML += `
                        <div class="admin-app-card">
                            <div class="admin-app-info">
                                <img src="${imgSource}" class="admin-app-icon" alt="icon">
                                <div class="admin-app-details">
                                    <h4>${data.name}</h4>
                                    <span>${data.version}</span>
                                </div>
                            </div>
                            <button class="delete-btn" onclick="deleteApp('${documentSnapshot.id}')">
                                <i class="fa-solid fa-trash"></i> حذف
                            </button>
                        </div>
                    `;
                });
            } catch (error) {
                list.innerHTML = '<p style="text-align:center; color:#EF4444;">حدث خطأ في تحميل التطبيقات.</p>';
            }
        }

        // دالة الحذف
        window.deleteApp = async function(docId) {
            const confirmDelete = confirm("متأكد إنك عايز تحذف التطبيق ده نهائياً من المتجر؟");
            if (confirmDelete) {
                try {
                    await deleteDoc(doc(db, "store_apps", docId));
                    loadAdminApps(); // تحديث القائمة فوراً
                } catch (error) {
                    alert("حدث خطأ أثناء الحذف.");
                }
            }
        }

        // تشغيل جلب التطبيقات أول ما الصفحة تفتح
        loadAdminApps();
    </script>
</body>
</html>
